name: Publish Linux Graphics Development Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "linux-graphics/**"
      - ".github/workflows/publish-linux-graphics.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-linux-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Linux graphics development image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eldritchcodex/linux-graphics-dev
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: linux-graphics
          file: linux-graphics/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=linux-graphics
          cache-to: type=gha,scope=linux-graphics,mode=max
